# Local development: Vite + NestJS watch mode + PostgreSQL.
# Run: docker compose up --build
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fresnel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      POSTGRES_DB: ${POSTGRES_DB:-fresnel}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - fresnel-db-data:/var/lib/postgresql/data
      # Only used on first initialization of an empty volume. Seed data is development-only.
      - ./db/1.ddl.sql:/docker-entrypoint-initdb.d/1.ddl.sql:ro
      - ./db/2.dml.sql:/docker-entrypoint-initdb.d/2.dml.sql:ro
      # Apply the repository's schema migration after seed data has been inserted.
      - ./db/migrations/1729339200000-new-narratives-entity.sql:/docker-entrypoint-initdb.d/3.migration.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [fresnel]
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: dev
    environment:
      NODE_ENV: development
      API_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-fresnel}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}@db:5432/${POSTGRES_DB:-fresnel}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./api:/app
      - api-node-modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/events').then(() => process.exit(0)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks: [fresnel]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web-shob/Dockerfile
      target: dev
    environment:
      NODE_ENV: development
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./web-shob:/app
      - web-node-modules:/app/node_modules
    depends_on:
      api:
        condition: service_started
    networks: [fresnel]
    restart: unless-stopped

networks:
  fresnel:
    name: fresnel-network
    driver: bridge

volumes:
  fresnel-db-data:
  api-node-modules:
  web-node-modules:
